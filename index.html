document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

font-family: 'Barlow Semi Condensed', sans-serif; font-size: 19px; font-weight: 600;\">Enviar fatura da distribuidora<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8F939D; margin-top: 4px;\">PDF ou foto/scan — os dados são extraídos e preenchidos abaixo<\u002Fdiv>\n        <\u002Flabel>\n        <div style=\"font-size: 13px; color: #8F939D; margin-top: 12px;\">{{ statusLeitura }}<\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #14213D; color: #F6F2EA; padding: 24px;\">\n        <div style=\"font-family: 'Barlow Semi Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; color: #F4A65A;\">Boleto a gerar no banco<\u002Fdiv>\n        <div style=\"font-family: 'Barlow Semi Condensed', sans-serif; font-size: 52px; font-weight: 700; line-height: 1.05; margin-top: 6px;\">{{ totalFmt }}<\u002Fdiv>\n        <div style=\"font-size: 14px; color: #B6BBC7; margin-top: 4px;\">Vencimento {{ d.vencimento }} · UC {{ d.unidade_consumidora }}<\u002Fdiv>\n        <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; padding-top: 18px; border-top: 1px solid #2C3A56; font-size: 13px;\">\n          <div>\n            <div style=\"color: #8F939D;\">Energia G3 (com desconto)<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 600;\">{{ energiaG3Fmt }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div>\n            <div style=\"color: #8F939D;\">Repasses Equatorial<\u002Fdiv>\n            <div style=\"font-size: 17px; font-weight: 600;\">{{ totalEquatorialFmt }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"background: #fff; border: 1px solid #E4DED2; padding: 22px;\">\n        <div style=\"font-family: 'Barlow Semi Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; color: #8F939D; margin-bottom: 14px;\">Boleto Sicoob<\u002Fdiv>\n        <label style=\"display: block; border: 1px dashed #C9C1B1; background: #F6F2EA; padding: 20px 18px; text-align: center; cursor: pointer;\" style-hover=\"border-color: #E8843C; background: #FBF7F0;\">\n          <input type=\"file\" accept=\"application/pdf,image/*\" sc-camel-on-change=\"{{ aoEscolherBoleto }}\" style=\"display: none;\">\n          <div style=\"font-family: 'Barlow Semi Condensed', sans-serif; font-size: 18px; font-weight: 600;\">Enviar boleto do banco<\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8F939D; margin-top: 4px;\">PDF ou foto — linha digitável e PIX são lidos do arquivo<\u002Fdiv>\n        <\u002Flabel>\n        <div style=\"font-size: 13px; color: #8F939D; margin-top: 10px;\">{{ nomeBoleto }}<\u002Fdiv>\n        <button sc-camel-on-click=\"{{ lerBoleto }}\" style=\"margin-top: 12px; width: 100%; background: #E8843C; color: #fff; border: none; padding: 12px; font-family: 'Barlow Semi Condensed', sans-serif; font-size: 15px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; cursor: pointer;\" style-hover=\"background: #D3742F;\">Ler boleto com IA<\u002Fbutton>\n        <div style=\"font-size: 13px; margin-top: 8px; color: {{ corBoleto }};\">{{ statusBoleto }}<\u002Fdiv>\n\n        <div style=\"margin-top: 18px; padding-top: 16px; border-top: 1px solid #EFEAE0;\">\n          <div style=\"font-family: 'Barlow Semi Condensed', sans-serif; text-transform: uppercase; letter-spacing: 0.14em; font-size: 12px; color: #8F939D; margin-bottom: 8px;\">Conferência do boleto<\u002Fdiv>\n\n          <sc-for list=\"{{ alertasBoleto }}\" as=\"a\" hint-placeholder-count=\"0\">\n            <div style=\"background: #FBF1E4; border-left: 3px solid #E8843C; padding: 9px 11px; font-size: 13px; margin-bottom: 8px; line-height: 1.45;\">{{ a.texto }}<\u002Fdiv>\n          <\u002Fsc-for>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 12px; font-size: 13px;\">\n            <div>\n              <div style=\"color: #8F939D; margin-bottom: 3px;\">Vencimento no boleto<\u002Fdiv>\n              <input type=\"text\" value=\"{{ boletoVencimento }}\" sc-camel-on-change=\"{{ aoMudarBoletoVencimento }}\" placeholder=\"DD/MM/AAAA\" style=\"width: 100%; border: 1px solid #DDD6C8; background: #FBF9F5; padding: 8px 10px; font-size: 15px; color: #14213D;\">\n            <\u002Fdiv>\n            <div>\n              <div style=\"color: #8F939D; margin-bottom: 3px;\">Valor no boleto<\u002Fdiv>\n              <input type=\"text\" value=\"{{ boletoValor }}\" sc-camel-on-change=\"{{ aoMudarBoletoValor }}\" placeholder=\"0,00\" style=\"width: 100%; border: 1px solid #DDD6C8; background: #FBF9F5; padding: 8px 10px; font-size: 15px; color: #14213D;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr; gap: 12px; font-size: 13px; margin-top: 12px;\">\n            <div>\n              <div style=\"color: #8F939D; margin-bottom: 3px;\">Nosso número<\u002Fdiv>\n              <input type=\"text\" value=\"{{ nossoNumero }}\" sc-camel-on-change=\"{{ aoMudarNossoNumero }}\" placeholder=\"1-3\" style=\"width: 100%; border: 1px solid #DDD6C8; background: #FBF9F5; padding: 8px 10px; font-size: 15px; color: #14213D;\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"font-size: 13px; color: #8F939D; margin-top: 10px;\">Beneficiário lido: {{ boletoBeneficiario }}<\u002Fdiv>\n\n          <div style=\"color: #8F939D; font-size: 13px; margin: 14px 0 3px;\">Instruções do boleto <span style=\"color: #C9C1B1;\">· uma por linha<\u002Fspan><\u002Fdiv>\n          <textarea rows=\"4\" value=\"{{ instrucoes }}\" sc-camel-on-change=\"{{ aoMudarInstrucoes }}\" placeholder=\"A partir 18/08/2026 Juros 0,03%/dia.\" style=\"width: 100%; border: 1px solid #DDD6C8; background: #FBF9F5; padding: 10px; font-size: 13px; line-height: 1.5; resize: vertical; color: #14213D;\"><\u002Ftextarea>\n\n          <div style=\"color: #8F939D; font-size: 13px; margin: 14px 0 3px;\">Linha digitável<\ inha() { return String(this.state.linha || '').replace(/\\D/g, ''); }\n\n  codigoBarras() {\n    const l = this.digitosLinha();\n    if (l.length !== 47) return '';\n    return l.slice(0, 4) + l.slice(32, 33) + l.slice(33, 47) + l.slice(4, 9) + l.slice(10, 20) + l.slice(21, 31);\n  }\n\n  desenharBarcode() {\n    const el = this.barcodeEl;\n    const cod = this.codigoBarras();\n    if (!el || !window.JsBarcode) return;\n    if (cod.length !== 44) { el.innerHTML = ''; el.removeAttribute('data-cod'); el.style.display = 'none'; return; }\n    if (el.getAttribute('data-cod') === cod) { el.style.display = 'block'; return; }\n    try {\n      window.JsBarcode(el, cod, { format: 'ITF', width: 1.6, height: 55, displayValue: false, margin: 0, lineColor: '#000000' });\n      el.setAttribute('preserveAspectRatio', 'none');\n      el.removeAttribute('width');\n      el.removeAttribute('height');\n      el.setAttribute('data-cod', cod);\n      el.style.display = 'block';\n    } catch (e) { el.innerHTML = ''; el.style.display = 'none'; }\n  }\n\n  linhaFormatada() {\n    const l = this.digitosLinha();\n    if (l.length !== 47) return this.state.linha ? this.state.linha : '—';\n    return l.slice(0, 5) + '.' + l.slice(5, 10) + '  ' + l.slice(10, 15) + '.' + l.slice(15, 21) + '  ' + l.slice(21, 26) + '.' + l.slice(26, 32) + '  ' + l.slice(32, 33) + '  ' + l.slice(33, 47);\n  }\n\n  // ---------- cálculo ----------\n  calc() {\n    const d = this.state.d;\n    const perc = toNum(this.state.percentual);\n    const fator = toNum(this.state.fator);\n    const kwh = toNum(d.energia_compensada_kwh);\n    const tarifa = toNum(d.tarifa_kwh);\n    const totalEq = toNum(d.valor_total_equatorial);\n    const integral = kwh * tarifa;\n    const desconto = integral * (perc / 100);\n    const energiaG3 = integral - desconto;\n    const ncomp = toNum(d.consumo_nao_compensado_valor);\n    const ip = toNum(d.iluminacao_publica);\n    const band = toNum(d.bandeira_valor);\n    const demais = Math.ro quatorial')] }\n    ];\n\n    const hist = Array.isArray(d.historico_consumo) ? d.historico_consumo : [];\n    const histEdit = hist.map((h, i) => ({\n      mes: h.mes, kwh: String(h.kwh == null ? '' : h.kwh),\n      aoMudar: (e) => {\n        const v = e.target.value;\n        this.setState(st => {\n          const arr = (st.d.historico_consumo || []).map((x, j) => j === i ? { mes: x.mes, kwh: v } : x);\n          return { d: Object.assign({}, st.d, { historico_consumo: arr }) };\n        }, () => this.salvarRascunho());\n      }\n    }));\n\n    const histView = hist.slice(-13);\n    const valores = histView.map(h => toNum(h.kwh));\n    const maxK = Math.max.apply(null, [1].concat(valores));\n    const barrasKwh = histView.map((h, i) => ({\n      mes: h.mes, rotulo: dec(valores[i], 0, 0),\n      cor: i === histView.length - 1 ? '#E8843C' : '#14213D',\n      altura: (valores[i] / maxK * 100).toFixed(2) + '%'\n    }));\n    // dado plausível? consumo real oscila; série idêntica ou em progressão regular indica extração inventada\n    const passos = valores.slice(1).map((v, i) => v - valores[i]);\n    const variacao = passos.length ? Math.max.apply(null, passos) - Math.min.apply(null, passos) : 0;\n    const histPlausivel = valores.length >= 3 && Math.max.apply(null, valores) > Math.min.apply(null, valores) && Math.abs(variacao) > 1;\n\n    const mkAtual = chaveMes(d.mes_referencia);\n    const regs = s.registros.slice();\n    const outros = regs.filter(r => r.mes_key !== mkAtual);\n    const serie = outros.map(r => ({ mes_key: r.mes_key, mes: r.mes_referencia, sem: toNum(r.sem_a_g3), com: toNum(r.total_a_pagar), desconto: toNum(r.desconto) }));\n    if (mkAtual) serie.push({ mes_key: mkAtual, mes: d.mes_referencia, sem: c.semG3, com: c.total, desconto: c.desconto });\n    serie.sort((a, b) => String(a.mes_key).localeCompare(String(b.mes_key)));\n    const ultimos = serie.slice(-6);\n    const maxR = Math.max.apply(null, [1].concat(ultimos.map(x => x.sem)));\n    const barrasComparativo = ultimos.map(x => ({\n      mes: x.mes, semFmt: dec(x.sem, 0, 0), comFmt: dec(x.com, 0, 0),\n      alturaSem: Math.max(3, Math.round((x.sem / maxR) * 88)) + '%',\n      alturaCom: Math.max(3, Math.round((x.com / maxR) * 88)) + '%'\n    }));\n    const acumulada = serie.reduce((a, x) => a + x.desconto, 0);\n\n    const docStr = String(d.documento || '');\n    let mascarado = '—';\n    if (docStr) {\n      const vis = docStr.slice(0, 5);\n      mascarado = vis + docStr.slice(5).replace(/\\d/g, '*');\n    }\n\n    const linhasEquatorial = [\n      { desc: 'Consumo não compensado', kwh: d.consumo_nao_compensado_kwh ? dec(d.consumo_nao_compensado_kwh, 0, 0) : '—', tarifa: c.ncomp && toNum(d.consumo_nao_compensado_kwh) ? dec(c.ncomp / toNum(d.consumo_nao_compensado_kwh), 6, 6) : '—', valor: brl(c.ncomp) },\n      { desc: 'Contribuição de iluminação pública', kwh: '—', tarifa: '—', valor: brl(c.ip) },\n      { desc: 'Bandeira tarifária ' + (d.bandeira_tarifaria || 'Verde'), kwh: '—', tarifa: '—', valor: brl(c.band) },\n      { desc: 'Demais encargos e tributos', kwh: '—', tarifa: '—', valor: brl(c.demais) }\n    ];\n\n    const dig = c.digitos;\n    const linhaOk = dig.length === 47;\n\n    return {\n      d: Object.assign({}, d, {\n        cliente: d.cliente || 'Nome do cliente',\n        endereco: d.endereco || '—',\n        unidade_consumidora: d.unidade_consumidora || '—',\n        vencimento: d.vencimento || '—',\n        mes_referencia: d.mes_referencia || '—'\n      }),\n      ehPainel: s.tab === 'painel',\n      ehDocumento: s.tab === 'documento',\n      irPainel: () => this.setState({ tab: 'painel' }),\n      irDocumento: () => this.setState({ tab: 'documento' }, () => { window.scrollTo(0, 0); setTimeout(() => { this.desenharBarcode(); this.desenharQr(); }, 60); }),\n      imprimir: () => window.print(),\n      estiloAba1: aba(s.tab === 'painel'),\n      estiloAba2: aba(s.tab === 'documento'),\n\n      aoEscolherArquivo: (e) => this.aoEscolherArquivo(e),\n      statusLeitura: s.statusLeitura,\n\n      linha: s.linha,\n      aoDigitarLinha: (e) => this.setState({ linha: e.target.value }, () => { this.salvarRascunho(); this.desenharBarcode(); }),\n      statusLinha: dig.length === 0 ? 'Cole a linha digitável de 47 dígitos gerada no banco.' : (linhaOk ? 'Linha válida · código de barras gerado.' : dig.length + ' de 47 dígitos — o código de barras não será impresso.'),\n      corLinha: dig.length === 0 ? '#8F939D' : (linhaOk ? '#3B7A57' : '#B07A2B'),\n      linhaFormatada: this.linhaFormatada(),\n      corpoLinha: this.pixPayload().length >= 20 ? '7.5px' : '11px',\n      notaBoleto: linhaOk ? 'Pagável em qualquer banco até o vencimento.' : 'Cole a linha digitável no painel para gerar o código de barras.',\n      refBarcode: (el) => { this.barcodeEl = el; this.desenharBarcode(); },\n      refQr: (el) => { this.qrEl = el; this.desenharQr(); },\n      aoEscolherBoleto: (e) => this.aoEscolherBoleto(e),\n      lerBoleto: () => this.lerBoleto(),\n      nomeBoleto: s.nomeBoleto,\n      statusBoleto: s.statusBoleto || 'Nenhum boleto lido ainda.',\n      corBoleto: s.boletoOk === null ? '#8F939D' : (s.boletoOk ? '#3B7A57' : '#B07A2B'),\n      boletoVencimento: s.boletoVencimento,\n      boletoValor: s.boletoValor,\n      boletoBeneficiario: s.boletoBeneficiario,\n      aoMudarBoletoVencimento: (e) => this.setState({ boletoVencimento: e.target.value }, () => this.salvarRascunho()),\n      aoMudarBoletoValor: (e) => this.setState({ boletoValor: e.target.value }, () => this.salvarRascunho()),\n      nossoNumero: s.nossoNumero,\n      nossoNumeroDoc: s.nossoNumero || '—',\n      aoMudarNossoNumero: (e) => this.setState({ nossoNumero: e.target.value }, () => this.salvarRascunho()),\n      instrucoes: s.instrucoes,\n      aoMudarInstrucoes: (e) => this.setState({ instrucoes: e.target.value }, () => this.salvarRascunho()),\n      linhasInstrucoes: String(s.instrucoes || '').split('\\n').map(x => x.trim()).filter(Boolean).map((t, i) => ({ texto: t, i })),\n      temInstrucoes: String(s.instrucoes || '').trim().length > 0,\n      alertasBoleto: (() => {\n        const av = [];\n        const vB = String(s.boletoVencimento || '').trim();\n        const vF = String(d.vencimento || '').trim();\n        if (vB && vF && vB !== vF) av.push({ texto: 'Vencimento divergente: o boleto vence em ' + vB + ', a fatura em ' + vF + '.' });\n        const valB = toNum(s.boletoValor);\n        if (valB && Math.abs(valB - c.total) > 0.01) av.push({ texto: 'Valor divergente: o boleto é de ' + brl(valB) + ' e o cálculo desta fatura dá ' + brl(c.total) + '.' });\n        const ben = String(s.boletoBeneficiario || '');\n        if (ben && ben !== '—' && !/g3/i.test(ben)) av.push({ texto: 'Beneficiário lido não menciona a G3: \"' + ben + '\". Confira se o boleto é o correto.' });\n        return av;\n      })(),\n      pix: s.pix,\n      pixTexto: this.pixPayload(),\n      temPix: this.pixPayload().length >= 20,\n      colunasPagamento: this.pixPayload().length >= 20 ? 'minmax(0, 1fr) minmax(0, 1fr)' : 'minmax(0, 1fr)',\n      aoDigitarPix: (e) => this.setState({ pix: e.target.value }, () => { this.salvarRascunho(); this.desenharQr(); }),\n      statusPix: this.pixPayload().length === 0 ? 'Sem PIX — o documento sai apenas com boleto.' : (this.pixPayload().indexOf('0002') === 0 ? 'Payload EMV reconhecido · QR Code gerado.' : 'Payload colado, mas não começa com 0002 — confira no boleto.'),\n      corPix: this.pixPayload().length === 0 ? '#8F939D' : (this.pixPayload().indexOf('0002') === 0 ? '#3B7A57' : '#B07A2B'),\n\n      percentualTxt: s.percentual,\n      aoMudarPercentual: (e) => this.setState({ percentual: e.target.value }, () => this.salvarRascunho()),\n      fatorTxt: s.fator,\n      aoMudarFator: (e) => this.setState({ fator: e.target.value }, () => this.salvarRascunho()),\n      fatorFmt: dec(c.fator, 3, 4),\n\n      secoes, histEdit,\n      statusHistorico: !hist.length ? 'Sem histórico lido — o gráfico MesFmt: dec(c.kwh + toNum(d.consumo_nao_compensado_kwh), 0, 0) + ' kWh',\n      co2Fmt: dec(c.co2, 1, 1) + ' kg',\n      acumuladaFmt: brl(serie.length > 1 ? acumulada : c.desconto),\n      acumuladaNota: serie.length > 1 ? 'com a G3 Solar desde ' + (serie[0].mes || '—') : 'Primeira fatura com a G3 Solar',\n      linhasEquatorial,\n      barrasKwh,\n      barrasComparativo,\n      temHistoricoKwh: histPlausivel,\n      temComparativo: ultimos.length >= 2,\n      colunasGraficos: (hist.length >= 1 && ultimos.length >= 2) ? 'minmax(0, 1fr) minmax(0, 1fr)' : 'minmax(0, 1fr)',\n      bandeiraNota: (d.bandeira_tarifaria || 'Verde') + (c.band ? ' (' + brl(c.band) + ')' : ' (sem adicional)')\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
